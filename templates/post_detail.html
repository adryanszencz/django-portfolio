{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
  <article class="card">
    <h2>{{ post.title }}</h2>
    <p class="meta">{{ post.author }} · {{ post.created_at|date:"d/m/Y H:i" }}</p>
    <div class="content">{{ post.content }}</div>
  </article>
  <p><a href="{% url 'index' %}">← Voltar para todos os posts</a></p>
{% endblock %}
